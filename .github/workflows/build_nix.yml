name: "Build Nix package on Ubuntu"

on:
  push:

jobs:
  build_legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
      - name: Building package
        run: nix-build . -A packages.x86_64-linux.default
  build_flakes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v32
      - name: Check flake
        run: nix flake check
      - name: Building package
        run: nix build
